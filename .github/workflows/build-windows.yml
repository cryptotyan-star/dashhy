name: Build Windows exe

on:
  workflow_dispatch: {}
  push:
    # No paths filter here on purpose. GitHub evaluates `paths` against the
    # commits contained in the push, and a tag push carries none — with a filter
    # present, `git push origin windows-v1.0.0` would silently run nothing,
    # which is exactly the failure mode this workflow already had once. The cost
    # is ~90 s of runner time on a main push that did not touch windows/.
    branches: [ main ]
    tags: [ 'windows-v*' ]
  # PRs build and smoke-test the exe but never publish — the Publish step is
  # gated on the ref. Until now a change to windows/ was only ever compiled
  # after it had been merged.
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

# Nothing here needs write except the publish step; the job asks for it.
permissions: {}

# The "windows" release is mutable, so two runs must never publish at once.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned build makes two "same" releases unreproducible.
          python -m pip install "pyinstaller==6.22.2" "pywebview==6.2.1"

      - name: Assemble source package
        shell: pwsh
        run: |
          # Zip source BEFORE the PyInstaller build runs, so build/ and dist/
          # (created by the next step) can't leak into the "source" archive.
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "windows/*" -DestinationPath "out/dashhy-windows-source.zip" -Force

      - name: Build Dashhy.exe
        working-directory: windows/project-dashboard
        run: pyinstaller --noconfirm Dashhy.spec

      # Prove the packaged binary actually serves the dashboard before it is
      # published. --selftest starts the bundled server, hits /, /api/projects
      # and /api/config, then exits — no window, so it works on a runner with
      # no desktop session. The exe is a GUI-subsystem binary with no stdout,
      # hence the report file.
      - name: Smoke-test Dashhy.exe
        shell: pwsh
        env:
          DASHHY_SELFTEST_OUT: ${{ github.workspace }}\selftest.txt
        run: |
          $exe = "windows/project-dashboard/dist/Dashhy.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Dashhy.exe --selftest timed out" }
          $p.Refresh()   # -PassThru without -Wait can leave ExitCode unpopulated
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { throw "no selftest report was written" }
          if ($p.ExitCode -ne 0) { throw "Dashhy.exe --selftest failed (exit $($p.ExitCode))" }
          Write-Host "Dashhy.exe self-test passed"

      - name: Assemble ready-to-run package
        shell: pwsh
        run: |
          $ready = "out/dashhy-windows-ready"
          New-Item -ItemType Directory -Force -Path $ready | Out-Null
          Copy-Item windows/project-dashboard/dist/Dashhy.exe "$ready/Dashhy.exe"
          Copy-Item "windows/Install Dashhy.bat" "$ready/"
          Copy-Item windows/README.md, windows/INSTALL.md, windows/SECURITY.md, windows/LICENSE, windows/THIRD_PARTY_NOTICES.md $ready/
          Compress-Archive -Path "$ready/*" -DestinationPath "out/dashhy-windows-ready.zip" -Force

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: dashhy-windows-build
          path: out/*.zip
          retention-days: 90

      # Assets are republished under fixed names, so a checksum file is the
      # only way for someone holding a zip to tell which build it came from.
      - name: Checksums and build manifest
        shell: pwsh
        run: |
          python -m pip freeze > out/build-manifest.txt
          Get-FileHash out/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      # Only main publishes. A workflow_dispatch on a branch still builds and
      # smoke-tests the exe, which is how a change gets verified before merge —
      # it just must not overwrite the public "windows" release while doing so.
      # target_commitish only decides where a tag is created; GitHub will not
      # move one that already exists, whatever the release object then says its
      # target is. So the rolling "windows" tag froze at the first release and
      # stayed there while six weeks of assets shipped under it — and froze
      # again one commit after the release object was "fixed". The only thing
      # that actually moves it is a force push, so do that, before publishing.
      - name: Point the rolling tag at this build
        if: github.ref == 'refs/heads/main'
        run: git push --force origin ${{ github.sha }}:refs/tags/windows

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # main keeps the rolling "windows" tag, so the download URL people
          # already have stays valid. Dispatching this workflow on a
          # `windows-v*` tag publishes that tag instead, as a release that is
          # never rewritten. target_commitish makes the tag point at the commit
          # actually built — without it GitHub created "windows" on whatever the
          # default branch happened to be, and it stayed there for six weeks.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'windows' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Dashhy {0}', github.ref_name) || 'Dashhy for Windows' }}
          body: |
            Автосборка Windows-версии Dashhy (собрано на `windows-latest` в GitHub Actions).

            - **dashhy-windows-ready.zip** — распакуй, запусти `Install Dashhy.bat`. Появится ярлык на рабочем столе, Dashhy запустится. Python не нужен.
            - **dashhy-windows-source.zip** — исходники + `build_app.bat`, для тех, кто хочет собрать сам.

            - **SHA256SUMS.txt** — контрольные суммы обоих архивов.

            Собрано из `${{ github.ref_name }}`, коммит `${{ github.sha }}`.
            Тег `windows` — катящийся: он переезжает на каждую сборку. Если нужна
            ссылка, которая никогда не изменится, бери релиз с тегом `windows-v*`.
            Лог сборки: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Перед публикацией `.exe` прошёл self-test: сервер поднялся и ответил на `/`, `/api/projects`, `/api/config`.
          files: |
            out/*.zip
            out/SHA256SUMS.txt
            out/build-manifest.txt
