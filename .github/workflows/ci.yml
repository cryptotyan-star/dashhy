name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Byte-compile both trees
        run: python -m compileall -q project-dashboard windows/project-dashboard

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      # Parity + the cmd.exe injection tests. The latter are skipped on macOS
      # and are the real point of running this matrix on windows-latest.
      - name: Tests
        run: python -m pytest tests -q

      # The bundled app has to actually serve the dashboard, not just import.
      # Runs the real HTTP server and hits /, /api/projects, /api/config.
      # server.py has no pywebview dependency, so this needs no GUI stack.
      - name: Server self-test (macOS tree)
        if: runner.os == 'macOS'
        run: python project-dashboard/server.py --selftest

      - name: Server self-test (Windows tree)
        if: runner.os == 'Windows'
        run: python windows/project-dashboard/server.py --selftest

      # The bug that started all of this was a macOS word left in the Windows
      # UI. Scoped to web/ on purpose: the .py files legitimately discuss macOS
      # in comments. Case-sensitive, so the internal `data-act="finder"` id is
      # not confused with the Finder app.
      - name: No macOS wording in the Windows UI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ! grep -rnE 'macOS|MacOS|Terminal\.app|iTerm|Finder|LaunchAgent|Powerbox|⌘' \
              windows/project-dashboard/web

  # Neither the macOS .app nor app.py was ever built or run by CI — only the
  # Windows exe was. This builds the real bundle and makes its server answer.
  macos-bundle:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Build Dashhy.app
        env:
          PYTHON: python
        run: bash project-dashboard/build_app.sh --no-install
      - name: Bundle self-test
        run: |
          ./project-dashboard/dist/Dashhy.app/Contents/MacOS/Dashhy --selftest
